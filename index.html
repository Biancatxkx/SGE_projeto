    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <section class="container">
            <section class="ft">
                <figure>
                    <img src="images/login.jpg" alt="Foto de um grupo de pessoas mexedo com equipamentos tecnológicos">
                </figure>
                <div class="filtro-vermelho"></div>
            </section>

                            <circle cx="441" cy="146" r="138" fill="#E30613" fill-opacity="0.1"/>
                            <circle cx="217.5" cy="71.5" r="138.5" fill="#E30613" fill-opacity="0.1"/>
                            <path d="M116 223C175.647 223 224 174.647 224 115C224 55.3532 175.647 7 116 7C56.3532 7 8 55.3532 8 115C8 174.647 56.3532 223 116 223Z" fill="#E30613" fill-opacity="0.1"/>
                        </g>
                        <defs>
                            <filter id="filter0_d_2092_39" x="0" y="-67" width="583" height="453" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                                <feFlood flood-opacity="0" result="BackgroundImageFix"/>

                <section class="login">
                    <h2>SGE|SISTEMA DE GESTÃO DE EMPRÉSTIMOS</h2>
                    <h1>Entrar</h1>
                </section>
                <main class="container3">
                    <form action="inicio.html">
                        <div class="containers">
                            <label for="mail">EMAIL</label>
                            <input type="email" id="mail" autocomplete="off" placeholder="Ex:harrypotter@gmail.com" required>
                        </div>
                        <div class="containers">
                            <label for="password">SENHA</label>
                            <input type="password" id="password" autocomplete="off" placeholder="Mínimo 6 dígitos" required>
                            <a href="forgot.html" id="forgot">Esqueceu sua Senha? Clique aqui</a>
                        </div>
                        <button id="log">Entrar</button>
                    </form>
                </main>
            </section>
        </section>
    </body>
    </html>
